name: YNSG release checks
on:
  push:
    branches: [codex/crm-workflow, codex/remaining-launch-checks]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-lifecycle-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ynsg_test
        options: >-
          --health-cmd "pg_isready -U postgres -d ynsg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify canonical lifecycle, concurrent holds and restore
        run: node scripts/verify-postgres.mjs
        env:
          YNSG_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
  contracts-browser-and-native-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked browser dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check contracts, permissions, application tests and browser dependency security
        run: npm run verify:release
      - name: Build production public website and CRM
        run: |
          node scripts/build.mjs
          pnpm --dir apps/web exec next build
      - name: Install browser engines for native form regression
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify rendered public masthead and booking layouts
        run: node scripts/verify-public-layout.mjs
      - name: Verify authentication through HTTP routes and real browser forms
        run: node scripts/verify-native-auth.mjs --browsers
      - name: Verify mobile owner workflow and responsive drawer
        run: node scripts/verify-owner-mobile.mjs
      - name: Verify workspace history, live permission changes and compact invoices
        run: node scripts/verify-workspace-navigation.mjs
      - name: Verify complete field request-to-receipt journey
        run: node scripts/verify-field-system.mjs
      - name: Install isolated locked native dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Verify native types, lint, SDK and iOS JavaScript bundle
        run: |
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile lint
          EXPO_OFFLINE=1 pnpm --dir apps/mobile exec expo install --check
          pnpm --dir apps/mobile bundle:ios
